<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>首行改写 · 腾讯 Marvis TENCENT</title>
<link rel="stylesheet" href="first-line.css">
<script src="_magpie/bridge.js"></script>
<script src="first-line.js" defer></script>
</head>
<body>
<!--
  这个文件是 magpie 的「panel」（package.json → magpie.panels，slot: provider）。
  它被塞进**每个 provider 编辑器**的 .plugin-slot 里，是个沙箱 iframe（allow-scripts），
  只能通过 _magpie/bridge.js 调 magpie 的消息 API：
    magpie.options.get() / .set(obj)   —— 读写**本插件自己的**选项
  所以这里改的就是 loader 读的那份 options.firstLine。
-->
<section class="fl">
  <h2 id="title">首行改写</h2>
  <p class="muted" id="hint">
    上游会把 system 提示词的**首句**当成身份指纹拦掉（403 非法请求）。
    这里决定被拦时怎么办。
  </p>

  <div class="fl-row">
    <label for="mode" id="mode-label">模式</label>
    <select id="mode">
      <option value="off" id="mode-off">off — 只走内置白名单（不改任何请求）</option>
      <option value="blocked" id="mode-blocked">blocked — 被拦后换兜底句重试一次（默认）</option>
      <option value="always" id="mode-always">always — 每个请求都换成下面这句</option>
    </select>
  </div>

  <div class="fl-row">
    <label for="text" id="text-label">首行文本</label>
    <input id="text" type="text" spellcheck="false" autocomplete="off">
  </div>

  <p class="muted" id="hint-text">
    留空 = 用内置兜底句 <code>You are a helpful assistant.</code>（不含任何 agent 产品名）。
    只替换 system 消息的**第一行**，第二行起原样。
  </p>

  <p class="fl-status" id="saved" role="status" aria-live="polite"></p>
</section>
</body>
</html>
